<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogos DS</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: #0a0a0a;
    font-family: 'Courier New', monospace;
    color: white;
  }

  h1 {
    font-size: 2.2rem;
    margin-bottom: 8px;
    text-shadow: 0 0 15px #f3f5ec;
  }

  p.subtitulo {
    color: #999;
    margin-bottom: 40px;
  }

  .cards {
    display: flex;
    gap: 60px;
    flex-wrap: wrap;
    justify-content: center;
  }

.card {
  position: relative;
  overflow: hidden; /* corta o blur que "vaza" pra fora da borda */
  width: 300px;
  aspect-ratio: 1 / 1;
  border: 2px solid #333;
  border-radius: 16px;
  padding: 32px 24px ;
  text-align: center;
  text-decoration: none;
  color: white;
  transition: transform 0.2s ease, border-color 0.2s ease;
 
}
  .card::before {
  content: '';
  position: absolute;
  inset: -10px; /* um pouco maior que o card pra cobrir a borda borrada */

  background-size: cover;
  background-position: center;
  filter: blur(1px) brightness(0.5);
  z-index: -1;
}
.card-gif::before{
      background-image: url('reflexo.gif');
}
  .card:hover {
    transform: translateY(-6px);
    border-color: #ffffff;
  }

  .card .emoji {
    font-size: 2.5rem;
    margin-bottom: 12px;
  }

  .card h2 {
    font-size: 1.1rem;
    margin-bottom: 6px;
  }

  .card p {
    color: #999;
    font-size: 0.85rem;
    
  }


</style>
</head>
<body>

  <h1>🕹️ Jogos DS</h1>
  <p class="subtitulo">Escolha um jogo pra testar</p>

  <div class="cards">
    <a href="reflexo.html" class="card card-gif">
      <h2>Teste de Reflexo</h2>
      <p>Clique o mais rápido possível</p>
    </a>

    <a href="snake.html" class="card"><div class="emoji">🐍</div><h2>Snake</h2><p>Controle a cobrinha e faça a maior pontuação</p></a>

    <a href="jogo.html" class="card">
     
      <h2>Desvie </h2>
      <p>Apenas permanecer vivo</p>
    </a>
  </div>

</body>

</html>
